name: GPU validation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Commit or branch to test (defaults to develop)"
        required: false
        type: string
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: read

concurrency:
  group: libddla-gpu-validation-${{ github.event_name == 'schedule' && 'daily' || github.run_id }}
  cancel-in-progress: false

jobs:
  gpu:
    name: Build and test 43 GPU cases on SAI
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    environment:
      name: ${{ github.event_name == 'schedule' && 'gpu-ci-scheduled' || 'gpu-ci-manual' }}
    env:
      REMOTE_HOST: c0.sai.ai-4s.com
      REMOTE_PORT: "12022"
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      REMOTE_ROOT: ~/libddla_gpu_ci
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || 'develop' }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted CI control files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-control
          sparse-checkout: .ci/slurm
          persist-credentials: false

      - name: Configure SSH
        env:
          REMOTE_SSH_PRIVATE_KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/remote-ssh"
          mkdir -m 700 "$root"
          printf '%s\n' "$REMOTE_SSH_PRIVATE_KEY" > "$root/id_ed25519"
          chmod 600 "$root/id_ed25519"
          cp trusted-control/.ci/slurm/known_hosts "$root/known_hosts"
          chmod 600 "$root/known_hosts"
          cat > "$root/config" <<EOF
          Host gpu-ci
              HostName $REMOTE_HOST
              Port $REMOTE_PORT
              User $REMOTE_USER
              IdentityFile $root/id_ed25519
              IdentitiesOnly yes
              StrictHostKeyChecking yes
              UserKnownHostsFile $root/known_hosts
              ForwardAgent no
              ServerAliveInterval 30
              ServerAliveCountMax 6
          EOF
          chmod 600 "$root/config"
          ssh-keygen -y -f "$root/id_ed25519" >/dev/null
          echo "REMOTE_SSH_CONFIG=$root/config" >> "$GITHUB_ENV"

      - name: Submit remote build and test
        id: remote
        continue-on-error: true
        run: |
          set -euo pipefail
          remote_root=$(ssh -F "$REMOTE_SSH_CONFIG" gpu-ci 'printf "%s/libddla_gpu_ci" "$HOME"')
          run_root="$remote_root/runs/github/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "REMOTE_RUN_ROOT=$run_root" >> "$GITHUB_ENV"
          ssh -F "$REMOTE_SSH_CONFIG" gpu-ci "mkdir -p '$run_root/source' '$run_root/control'"
          tar --exclude=.git -C source -czf - . \
            | ssh -F "$REMOTE_SSH_CONFIG" gpu-ci "tar -xzf - -C '$run_root/source'"
          scp -F "$REMOTE_SSH_CONFIG" \
            trusted-control/.ci/slurm/config.ini trusted-control/.ci/slurm/modules.sh \
            trusted-control/.ci/slurm/known_hosts \
            trusted-control/.ci/slurm/build.sbatch.in trusted-control/.ci/slurm/test.sbatch.in \
            trusted-control/.ci/slurm/mpirun_with_mapping.sh trusted-control/.ci/slurm/rank_in_container.sh trusted-control/.ci/slurm/report.py trusted-control/.ci/slurm/case_plan.py trusted-control/.ci/slurm/run_case.py \
            trusted-control/.ci/slurm/create-rootfs.sh trusted-control/.ci/slurm/submit.sh \
            "gpu-ci:$run_root/control/"
          ssh -F "$REMOTE_SSH_CONFIG" gpu-ci \
            "chmod 700 '$run_root/control/'*.sh; '$run_root/control/submit.sh' '$run_root'"

      - name: Download raw results
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/libddla-gpu-results"
          if ! ssh -F "$REMOTE_SSH_CONFIG" gpu-ci \
            "tar -C '$REMOTE_RUN_ROOT' -czf - results" \
            | tar -xzf - -C "$RUNNER_TEMP/libddla-gpu-results" \
                --no-same-owner --no-same-permissions; then
            echo "warning: remote result download failed" >&2
          fi
          if [[ ! -s "$RUNNER_TEMP/libddla-gpu-results/results/summary.md" ]]; then
            cat > "$RUNNER_TEMP/libddla-gpu-results/results/summary.md" <<'EOF'
          # LibDDLA GPU validation

          Remote build/test did not produce a result report. See the Slurm logs in the uploaded artifact.
          EOF
          fi

      - name: Publish 43-case table
        if: always()
        run: cat "$RUNNER_TEMP/libddla-gpu-results/results/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libddla-gpu-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/libddla-gpu-results/results
          if-no-files-found: warn
          retention-days: 30

      - name: Fail when remote validation failed
        if: steps.remote.outcome == 'failure'
        run: exit 1
