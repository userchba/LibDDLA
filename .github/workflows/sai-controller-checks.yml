name: SAI controller checks

on:
  pull_request:
    paths: ['.ci/sai/**', '.github/workflows/sai-*.yml']
  push:
    branches: [main, develop]
    paths: ['.ci/sai/**', '.github/workflows/sai-*.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .ci/sai/tests -v
      - run: |
          for script in .ci/sai/*.sh .ci/sai/*.sbatch .ci/sai/deployment/*.sh; do
            bash -n "$script"
          done
