name: SAI CUDA validation
run-name: SAI CUDA / ${{ github.event.pull_request.number || 0 }} / ${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA approved for the manual run
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: sai-cuda-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cuda:
    if: >-
      github.repository == 'userchba/LibDDLA' &&
      ((github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
       (vars.SAI_CI_ENABLED == 'true' &&
        (github.event_name == 'pull_request' ||
         (github.event_name == 'push' && !github.event.deleted))))
    name: SAI V100, full CUDA suite and six-rank matrix tests
    runs-on: [self-hosted, Linux, X64, sai-libddla-results]
    environment: ${{ github.event_name == 'push' && 'sai-libddla-push' || 'sai-libddla' }}
    timeout-minutes: 180
    env:
      DDLA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}
      DDLA_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Give the site service this attempt's read-only token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 022
          request="/srv/sai-libddla/requests/$DDLA_RUN_ID.token"
          (set -o noclobber; printf '%s' "$GH_TOKEN" > "$request")

      - name: Read this attempt's result from SAI
        timeout-minutes: 175
        run: |
          set -euo pipefail
          result="/srv/sai-libddla/results/$DDLA_RUN_ID"
          [[ "$DDLA_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          until [[ -f "$result/completion.json" ]]; do sleep 10; done
          if [[ -s "$result/remote/summary.md" ]]; then
            cat "$result/remote/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          jq -e --arg id "$DDLA_RUN_ID" --arg sha "$DDLA_SOURCE_SHA" \
            '.run_id == $id and .source_sha == $sha and .exit_code == 0' "$result/completion.json"
          jq -e '.success == true' "$result/remote/summary.json"

      - name: Upload JUnit, logs, toolchain and Slurm evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libddla-sai-${{ github.run_id }}-${{ github.run_attempt }}
          path: /srv/sai-libddla/results/${{ env.DDLA_RUN_ID }}/
          if-no-files-found: error
          retention-days: 30

      - name: Remove this attempt's API token
        if: always()
        run: rm -f -- "/srv/sai-libddla/requests/$DDLA_RUN_ID.token"
