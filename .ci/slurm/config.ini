[remote]
host = c0.sai.ai-4s.com
port = 12022
user = ${REMOTE_USER}
project_root = ~/libddla_gpu_ci

[build]
partition = 4V100
qos = flood-1o2gpu
gpus = 1
time = 00:30:00

[test]
partition = 16V100
qos = flood-gpu
time = 04:00:00
array_concurrency = 8

[small_test]
partition = 4V100
qos = flood-1o2gpu
max_gpus = 2

[improper_test]
partition = 8V100V0
qos = improper-gpu

[cross_node]
case = test_pzgemm_mpi
partition = 4V100
qos = flood-1o2gpu
nodes = 2
gpus_per_node = 1
tasks_per_node = 1
time = 04:00:00

[cluster]
mapping_root = /opt/sai_config/mps_mapping.d
disable_nccl_ib = false

[container]
rootfs = ~/libddla_gpu_ci/rootfs
