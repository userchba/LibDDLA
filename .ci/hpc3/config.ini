; Each job lists eligible partitions and can start on any of them.
; cpus is the requested number of CPU cores per MPI rank.
; GPU memory is requested per device to override HPC3 partition defaults.

[cpu]
; debug is usually idle, but its QOS takes one job per user (8 CPUs, 24 GB,
; 2 h); when that slot is taken submit.sh retries on fallback_partition.
partition = debug,48cp1,48cp2,48cp3,p1
fallback_partition = 48cp1,48cp2,48cp3,p1
cpus = 2
mem = 16G
time = 01:00:00
full_time = 02:00:00

[gpu4]
; 4-rank GPU suite (all default-DDLA_TEST_NP=4 tests + the 1-rank cases).
; All three partitions are 8x V100 32 GB nodes; v100g32 is chronically
; congested, but listing it costs nothing. getrf_nopiv alone holds ~51 GB
; of host memory for its n=20000 complex cases, so retain 128G in total.
partition = v100m3,v100g32fat,v100g32
gpus = 4
cpus = 3
mem_per_gpu = 32G
time = 01:00:00

[gpu6]
; 6-rank indexed pgeadd and GEMM branch suite.
partition = v100m3,v100g32fat,v100g32
gpus = 6
cpus = 3
mem_per_gpu = 11G
time = 01:00:00
