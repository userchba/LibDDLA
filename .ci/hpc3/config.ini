; Each job lists several partitions: Slurm starts it in whichever frees up
; first. Short time limits let the backfill scheduler slot the jobs into
; gaps on busy partitions (each job finishes in a few minutes).

[cpu]
; debug is usually idle, but its QOS takes one job per user (8 CPUs, 24 GB,
; 2 h); when that slot is taken submit.sh retries on fallback_partition.
partition = debug,48cp1,48cp2,48cp3,p1
fallback_partition = 48cp1,48cp2,48cp3,p1
cpus = 2
mem = 16G
time = 01:00:00

[gpu4]
; 4-rank GPU suite (all default-DDLA_TEST_NP=4 tests + the 1-rank cases).
; All three partitions are 8x V100 32 GB nodes; v100g32 is chronically
; congested, but listing it costs nothing. Two tests run at a time and
; getrf_nopiv alone holds ~51 GB of host memory (two n=20000 complex
; copies per rank), so 64G got OOM-killed when it shared the job.
partition = v100m3,v100g32fat,v100g32
gpus = 4
cpus = 16
mem = 128G
time = 01:00:00

[gpu6]
; 6-rank indexed pgeadd and GEMM branch suite.
partition = v100m3,v100g32fat,v100g32
gpus = 6
cpus = 16
mem = 64G
time = 01:00:00
